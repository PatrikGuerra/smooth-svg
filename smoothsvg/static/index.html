<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smooth-svg</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
  :root { color-scheme: light dark;
    --bg:#f4f5f4; --fg:#16201d; --card:#fff; --line:#d5dad7; --muted:#5d6b66;
    --accent:#15803d; --main-ring:#00a82d; --on-accent:#fff; --primary:#023730; --on-primary:#fff; --tip-bg:#16201d; --tip-fg:#fff; }
  :root[data-theme=dark] {
    --bg:#121816; --fg:#eef3f0; --card:#1c2421; --line:#33403b; --muted:#9aa8a2;
    --accent:#84cc16; --main-ring:#39ff14; --on-accent:#0b1f1a; --primary:#84cc16; --on-primary:#0b1f1a; --tip-bg:#eef3f0; --tip-fg:#121816; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --bg:#121816; --fg:#eef3f0; --card:#1c2421; --line:#33403b; --muted:#9aa8a2;
    --accent:#84cc16; --main-ring:#39ff14; --on-accent:#0b1f1a; --primary:#84cc16; --on-primary:#0b1f1a; --tip-bg:#eef3f0; --tip-fg:#121816; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header, footer, #panel { background:var(--card); border-color:var(--line); }
  header { display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:8px; flex:1; font-weight:700; font-size:16px; }
  .brand img { height:30px; width:auto; }
  button, label.btn, select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover:not(:disabled), label.btn:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .icon { padding:6px 10px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); }
  button.primary, label.btn.primary { background:var(--primary); color:var(--on-primary); border-color:var(--primary); font-weight:600; padding:8px 18px; }
  main { flex:1; display:flex; min-height:0; }
  #panel { width:270px; overflow-y:auto; padding:12px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  #panel h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:10px 0 0; }
  #levels { display:flex; } #levels button { flex:1; padding:6px 4px; }
  .ctl { position:relative; display:flex; flex-direction:column; gap:4px; }
  .ctl.muted { opacity:.45; }
  .head { display:flex; align-items:center; gap:6px; }
  .head .sp { flex:1; }
  .head b { font-weight:600; min-width:3.5em; text-align:right; }
  .auto { display:flex; align-items:center; gap:3px; font-size:12px; color:var(--muted); cursor:pointer; }
  .row { display:flex; align-items:center; gap:8px; cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=checkbox] { accent-color:var(--accent); }
  .help { width:18px; height:18px; padding:0; border-radius:50%; font-size:11px; line-height:16px; color:var(--muted); flex:none; }
  .help:hover::after, .help:focus-visible::after { content:attr(data-tip); position:absolute; left:0; right:0; top:100%; z-index:20;
    margin-top:4px; background:var(--tip-bg); color:var(--tip-fg); padding:7px 9px; border-radius:6px; font-size:12px; line-height:1.4; text-align:left; font-weight:400; }
  #palette { display:flex; flex-wrap:wrap; gap:6px; }
  #palette button { width:26px; height:26px; padding:0; border-radius:50%; border:2px solid var(--line); }
  #palette button.off { opacity:.3; border-style:dashed; }
  .hint, .note { font-size:12px; color:var(--muted); line-height:1.5; }
  .note { border-left:3px solid var(--accent); padding-left:8px; }
  #reset { margin-top:6px; }
  #views { flex:1; display:flex; min-width:0; position:relative; }
  .pane { flex:1; overflow:hidden; position:relative; border-right:1px solid var(--line); cursor:grab;
          /* always a light checkerboard, so dark artwork stays visible in the dark theme too */
          background:repeating-conic-gradient(#e4e6e5 0 25%, #f7f8f7 0 50%) 0 0/16px 16px; }
  .pane .tag { color:#5d6b66; }
  .pane:active { cursor:grabbing; }
  .pane .tag { position:absolute; top:6px; left:8px; z-index:3; font-size:12px; pointer-events:none; }
  .layer { position:absolute; left:0; top:0; transform-origin:0 0; }
  #inImg { image-rendering:pixelated; display:block; }
  .inbar { position:absolute; top:28px; left:8px; z-index:5; display:flex; align-items:center; gap:8px; cursor:default; }
  .inbar .seg button { padding:3px 9px; font-size:12px; }
  #kTag { font-size:12px; font-variant-numeric:tabular-nums; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:2px 8px; }
  #kTag:empty { display:none; }
  #svgBox svg, #svgBox img { display:block; }
  body.wipe #views { display:block; }
  body.wipe .pane { position:absolute; inset:0; border:0; }
  body.wipe #outPane { clip-path:inset(0 0 0 var(--wipe,50%)); }
  #wipeBar { display:none; position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:4; left:var(--wipe,50%); pointer-events:none; }
  body.wipe #wipeBar { display:block; }
  #drop { position:absolute; inset:0; z-index:6; display:grid; place-items:center; background:var(--bg); }
  .dropcard { text-align:center; padding:40px 48px; border:2px dashed var(--line); border-radius:16px; background:var(--card); max-width:460px; }
  body.dragging .dropcard { border-color:var(--accent); }
  .dropcard img { height:110px; width:auto; }
  .dropcard h1 { font-size:20px; margin:14px 0 6px; }
  .dropcard p { margin:6px 0; color:var(--muted); }
  .dropcard .actions { display:flex; gap:10px; justify-content:center; margin:16px 0 10px; }
  .zoombar { position:absolute; right:12px; bottom:12px; z-index:5; display:flex; align-items:center; gap:4px; background:var(--card);
             border:1px solid var(--line); border-radius:10px; padding:4px; }
  .zoombar button { padding:4px 10px; }
  #zoomPct { min-width:4em; text-align:center; font-variant-numeric:tabular-nums; }
  footer { padding:8px 12px; border-top:1px solid var(--line); display:flex; gap:16px; align-items:center; }
  footer .sp { flex:1; }
  footer button { white-space:nowrap; }
  #wipe { width:260px; flex:none; }
  #status { white-space:nowrap; }
  .head b:empty { min-width:0; }
  #sizes { font-weight:600; }
  #fid { color:var(--muted); }
  #busy { position:absolute; inset:0; z-index:5; display:none; place-items:center; pointer-events:none; background:#0003; }
  body.loading #busy { display:grid; }
  .spinner { width:44px; height:44px; border:5px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner, #status.busy::before { animation:none; } }
  #status.busy::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  .err { color:#dc2626; }
  #mgDlg { position:fixed; z-index:40; top:var(--my,60px); left:var(--mx,calc(100vw - 340px)); width:328px; max-height:calc(100vh - 140px); display:flex; flex-direction:column;
    background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 28px #0005; }
  #mgBar { display:flex; align-items:center; gap:8px; padding:8px 8px 8px 12px; border-bottom:1px solid var(--line); cursor:move; touch-action:none; user-select:none; border-radius:12px 12px 0 0; }
  #mgBar h2 { margin:0; font-size:14px; flex:1; }
  #mgBody { overflow-y:auto; padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  #mgBody h3 { margin:6px 0 0; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .mglist { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .mglist li { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .mglist li.off .sw { opacity:.3; border-style:dashed; }
  .mglist label.pick { display:flex; align-items:center; gap:8px; flex:1; cursor:pointer; }
  .sw { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; display:inline-block; }
  .sw.sm { width:14px; height:14px; border-width:1px; margin-right:-4px; }
  .opts { display:flex; flex-wrap:wrap; gap:6px; align-items:flex-start; flex:1; }
  .opt { all:unset; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:2px; width:62px; padding:4px 2px; border-radius:8px; cursor:pointer; font-size:11px; text-align:center; }
  .opt:focus-visible, .opt.plus:focus-within { outline:2px solid var(--fg); outline-offset:2px; }
  .opt .dot { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:16px; font-weight:700; line-height:1; color:#000; text-shadow:0 0 3px #fff, 0 0 3px #fff; }
  .opt[aria-checked=true] .dot, .opt.on .dot { border-color:var(--main-ring); box-shadow:0 0 0 2px var(--main-ring); }
  .opt[aria-checked=true] .dot::after, .opt.on .dot::after { content:"\2713"; }
  .opt .mtag { color:var(--fg); font-weight:700; min-height:1em; }
  .opt.plus .dot { border-style:dashed; color:var(--muted); text-shadow:none; position:relative; overflow:hidden; }
  .opt.plus input { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
  .opt.plus.on .dot { border-style:solid; }
  .mglist li.off .opt .dot { opacity:.4; }
  .mglist li.grp { align-items:flex-start; }
  .mglist .sp { flex:1; }
  .mglist input[role=switch] { appearance:none; width:34px; height:20px; border-radius:10px; background:var(--line); position:relative; cursor:pointer; flex:none; margin:0; }
  .mglist input[role=switch]::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--card); border:1px solid var(--muted); box-sizing:border-box; }
  .mglist input[role=switch]:checked { background:var(--accent); }
  .mglist input[role=switch]:checked::after { left:16px; }
  .mglist input[role=switch]:disabled { opacity:.45; cursor:default; }
  @media (prefers-reduced-motion: no-preference) { .mglist input[role=switch]::after { transition:left .12s; } #mgDlg:not([hidden]) { animation:fade .15s; } @keyframes fade { from { opacity:0; } } }
  #palette span { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:inline-block; }
  #palette span.off { opacity:.3; border-style:dashed; }
  @media (max-width:700px) { #mgDlg { left:0; right:0; top:auto; bottom:0; width:auto; max-height:50vh; border-radius:12px 12px 0 0; } #mgBar { cursor:default; } }
  #updbar { display:flex; gap:10px; align-items:center; padding:6px 12px; background:var(--accent); color:var(--on-accent); }
  #updbar .sp { flex:1; }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="/static/logo.svg" alt=""><span>smooth-svg</span></div>
  <label class="btn"><span data-i18n="open"></span><input id="file" type="file" accept="image/png,image/jpeg" hidden></label>
  <div class="seg" role="group" data-i18n-label="view">
    <button id="viewSide" type="button" aria-pressed="true" data-i18n="side"></button>
    <button id="viewWipe" type="button" aria-pressed="false" data-i18n="wipe"></button>
  </div>
  <label class="btn" data-i18n-title="compare_tip"><span data-i18n="compare"></span><input id="ref" type="file" accept=".svg,image/svg+xml" hidden></label>
  <button id="refBtn" type="button" hidden></button>
  <select id="lang" data-i18n-label="lang"><option value="en">EN</option><option value="pt">PT</option></select>
  <button id="themeBtn" class="icon" type="button" data-i18n-title="theme">&#9680;</button>
</header>
<div id="updbar" role="status" hidden>
  <span id="updmsg"></span><span class="sp"></span>
  <button id="updNow" type="button" data-i18n="upd_now"></button>
  <button id="updLater" type="button" data-i18n="upd_later"></button>
</div>
<main>
  <div id="panel">
    <div class="ctl">
      <div class="head"><span data-i18n="level"></span><button class="help" type="button" data-tip-key="level_tip">?</button></div>
      <div id="levels" class="seg" role="group">
        <button type="button" data-level="simple" data-i18n="simple"></button>
        <button type="button" data-level="balanced" data-i18n="balanced" aria-pressed="true"></button>
        <button type="button" data-level="detailed" data-i18n="detailed"></button>
      </div>
    </div>

    <h2 data-i18n="sec_image"></h2>
    <div class="ctl">
      <div class="head"><label for="model" data-i18n="model"></label><button class="help" type="button" data-tip-key="model_tip">?</button></div>
      <select id="model">
        <option value="auto" data-i18n="m_auto"></option><option value="clipart" data-i18n="m_clipart"></option>
        <option value="drawing" data-i18n="m_drawing"></option><option value="pixelart" data-i18n="m_pixelart"></option>
        <option value="photo" data-i18n="m_photo"></option>
      </select>
      <small id="usedModel" class="hint"></small>
    </div>
    <div class="ctl"><div class="head"><label class="row"><input id="bg" type="checkbox"><span data-i18n="bg"></span></label><span class="sp"></span><button class="help" type="button" data-tip-key="bg_tip">?</button></div></div>
    <div class="ctl"><div class="head"><label class="row"><input id="denoise" type="checkbox" checked><span data-i18n="noise"></span></label><span class="sp"></span><button class="help" type="button" data-tip-key="noise_tip">?</button></div></div>
    <div class="ctl" data-locks><div class="head"><label class="row"><input id="soft" type="checkbox" checked><span data-i18n="soft"></span></label><span class="sp"></span><button class="help" type="button" data-tip-key="soft_tip">?</button></div></div>
    <p id="drawingNote" class="note" data-i18n="drawing_note" hidden></p>

    <h2 data-i18n="sec_colors"></h2>
    <div class="ctl" data-locks>
      <div class="head"><label for="colors" data-i18n="colors"></label><button class="help" type="button" data-tip-key="colors_tip">?</button><span class="sp"></span>
        <label class="auto"><input id="colors_auto" type="checkbox" checked><span data-i18n="auto"></span></label><b id="v_colors"></b></div>
      <input id="colors" type="range" min="2" max="16" value="6">
    </div>
    <div class="ctl" data-locks>
      <div class="head"><label for="merge" data-i18n="merge"></label><button class="help" type="button" data-tip-key="merge_tip">?</button><span class="sp"></span><b id="v_merge"></b></div>
      <input id="merge" type="range" min="0" max="40" value="10">
    </div>
    <div id="palette" role="group"></div>
    <small id="paletteHint" class="hint" data-i18n="palette_hint" hidden></small>
    <button id="mergeBtn" type="button" data-i18n="mg_open" disabled></button>

    <h2 data-i18n="sec_edges"></h2>
    <div class="ctl">
      <div class="head"><label for="smooth" data-i18n="smooth"></label><button class="help" type="button" data-tip-key="smooth_tip">?</button><span class="sp"></span><b id="v_smooth"></b></div>
      <input id="smooth" type="range" min="0" max="5" value="2">
    </div>
    <div class="ctl" data-locks>
      <div class="head"><label for="corner" data-i18n="corner"></label><button class="help" type="button" data-tip-key="corner_tip">?</button><span class="sp"></span>
        <label class="auto"><input id="corner_auto" type="checkbox" checked><span data-i18n="auto"></span></label><b id="v_corner"></b></div>
      <input id="corner" type="range" min="5" max="180" step="5" value="90">
    </div>
    <div class="ctl" data-locks>
      <div class="head"><label for="curve" data-i18n="curve"></label><button class="help" type="button" data-tip-key="curve_tip">?</button><span class="sp"></span>
        <label class="auto"><input id="curve_auto" type="checkbox" checked><span data-i18n="auto"></span></label><b id="v_curve"></b></div>
      <input id="curve" type="range" min="1" max="20" value="3">
    </div>
    <div class="ctl" data-locks>
      <div class="head"><label for="spots" data-i18n="spots"></label><button class="help" type="button" data-tip-key="spots_tip">?</button><span class="sp"></span>
        <label class="auto"><input id="spots_auto" type="checkbox" checked><span data-i18n="auto"></span></label><b id="v_spots"></b></div>
      <input id="spots" type="range" min="0" max="9" value="2">
    </div>

    <h2 data-i18n="sec_shapes"></h2>
    <div class="ctl" data-locks><div class="head"><label class="row"><input id="ellipses" type="checkbox" checked><span data-i18n="ellipses"></span></label><span class="sp"></span><button class="help" type="button" data-tip-key="ellipses_tip">?</button></div></div>
    <div class="ctl" data-locks><div class="head"><label class="row"><input id="polygons" type="checkbox"><span data-i18n="polygons"></span></label><span class="sp"></span><button class="help" type="button" data-tip-key="polygons_tip">?</button></div></div>
    <div class="ctl" data-locks>
      <div class="head"><label for="tol" data-i18n="tol"></label><button class="help" type="button" data-tip-key="tol_tip">?</button><span class="sp"></span><b id="v_tol"></b></div>
      <input id="tol" type="range" min="1" max="15" value="3">
    </div>

    <button id="reset" type="button" data-i18n="reset"></button>
    <p class="hint" data-i18n="keys"></p>
  </div>
  <div id="views">
    <div class="pane" id="inPane"><span class="tag" data-i18n="input"></span><div class="inbar"><div class="seg" id="inViews" role="group" data-i18n-label="in_view">
      <button type="button" data-in="orig" aria-pressed="true" data-i18n="in_orig"></button>
      <button type="button" data-in="reduced" aria-pressed="false" data-i18n="in_reduced" disabled></button>
      <button type="button" data-in="upscaled" aria-pressed="false" data-i18n="in_up" disabled></button>
    </div><span id="kTag"></span></div><div class="layer" id="inLayer"><img id="inImg" alt=""></div></div>
    <div class="pane" id="outPane"><span class="tag">SVG</span><div class="layer" id="svgBox"></div></div>
    <div id="wipeBar"></div>
    <div class="zoombar" id="zoombar" hidden>
      <button id="zoomOut" type="button" data-i18n-title="zoom_out">&minus;</button>
      <span id="zoomPct">100%</span>
      <button id="zoomIn" type="button" data-i18n-title="zoom_in">+</button>
      <button id="zoomFit" type="button" data-i18n="fit"></button>
    </div>
    <div id="drop">
      <div class="dropcard">
        <img src="/static/logo.svg" alt="">
        <h1 data-i18n="drop_title"></h1>
        <p data-i18n="drop_sub"></p>
        <div class="actions">
          <label class="btn primary"><span data-i18n="open"></span><input id="file2" type="file" accept="image/png,image/jpeg" hidden></label>
          <button id="sample" type="button" data-i18n="sample" hidden></button>
        </div>
        <p class="hint" data-i18n="drop_paste"></p>
      </div>
    </div>
    <div id="busy" role="status" aria-live="polite"><div class="spinner"></div></div>
  </div>
</main>
<footer>
  <span id="status" aria-live="polite"><span id="sizes"></span> <span id="fid"></span></span><span class="sp"></span>
  <label class="row hint" id="updOpt" hidden><input id="updCheck" type="checkbox"><span data-i18n="upd_check"></span></label>
  <input id="wipe" type="range" min="0" max="100" value="50" hidden data-i18n-label="wipe_pos">
  <button id="cp" type="button" data-i18n="copy" disabled></button>
  <button id="dl" type="button" class="primary" data-i18n="download" disabled></button>
</footer>
<section id="mgDlg" role="dialog" aria-labelledby="mgTitle" tabindex="-1" hidden>
  <div id="mgBar" tabindex="0" data-i18n-title="mg_move">
    <h2 id="mgTitle" data-i18n="mg_title"></h2>
    <button id="mgClose" type="button" class="icon" data-i18n-title="mg_close">&times;</button>
  </div>
  <div id="mgBody">
    <p class="hint" data-i18n="mg_help"></p>
    <p class="note" id="mgNote" data-i18n="mg_off" hidden></p>
    <ul id="mgColors" class="mglist"></ul>
    <button id="mgAdd" type="button" data-i18n="mg_add" disabled></button>
    <h3 data-i18n="mg_groups"></h3>
    <ul id="mgGroups" class="mglist"></ul>
    <button id="mgReset" type="button" data-i18n="mg_reset"></button>
  </div>
</section><script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
