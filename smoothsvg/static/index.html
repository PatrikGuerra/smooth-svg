<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smooth-svg</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f5; --fg:#18181b; --card:#fff; --line:#d4d4d8; --accent:#2563eb; }
  :root[data-theme=dark] { --bg:#18181b; --fg:#f4f4f5; --card:#27272a; --line:#3f3f46; --accent:#60a5fa; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg:#18181b; --fg:#f4f4f5; --card:#27272a; --line:#3f3f46; --accent:#60a5fa; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header, footer, #panel { background:var(--card); border-color:var(--line); }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; flex:1; }
  button, label.btn { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #panel { width:240px; overflow-y:auto; padding:10px 12px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  #panel h2 { font-size:11px; letter-spacing:.06em; text-transform:uppercase; opacity:.6; margin:8px 0 0; }
  #panel label { display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 8px; }
  #panel label > select, #panel label > small, #panel label > input[type=range] { grid-column:1 / -1; }
  #panel label.row { display:flex; align-items:center; gap:8px; }
  #panel label b { font-weight:600; }
  #panel .hint { font-size:12px; opacity:.6; line-height:1.5; margin-top:6px; }
  #drop[hidden] { display:none; }
  #views { flex:1; display:flex; min-width:0; position:relative; }
  .pane { flex:1; overflow:hidden; position:relative; border-right:1px solid var(--line); cursor:grab;
          background:repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0 0/16px 16px; }
  .pane:active { cursor:grabbing; }
  .pane .tag { position:absolute; top:6px; left:8px; z-index:3; font-size:12px; opacity:.7; pointer-events:none; }
  .layer { position:absolute; left:0; top:0; transform-origin:0 0; }
  #inImg { image-rendering:pixelated; display:block; }
  #svgBox svg, #svgBox img { display:block; }
  body.wipe #views { display:block; }
  body.wipe .pane { position:absolute; inset:0; border:0; }
  body.wipe #outPane { clip-path: inset(0 0 0 var(--wipe,50%)); }
  #wipeBar { display:none; position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:4; left:var(--wipe,50%); pointer-events:none; }
  body.wipe #wipeBar { display:block; }
  #drop { position:absolute; inset:0; display:grid; place-items:center; opacity:.6; pointer-events:none; }
  footer { padding:6px 12px; border-top:1px solid var(--line); display:flex; gap:16px; align-items:center; }
  footer .sp { flex:1; }
  select { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px; }
  #busy { position:absolute; inset:0; z-index:5; display:none; place-items:center; pointer-events:none; background:#0003; }
  body.loading #busy { display:grid; }
  .spinner { width:44px; height:44px; border:5px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
  #stats.busy::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  .err { color:#dc2626; }
  #palette { display:flex; flex-wrap:wrap; gap:6px; }
  #palette button { width:26px; height:26px; padding:0; border-radius:50%; border:2px solid var(--line); }
  #palette button.off { opacity:.3; border-style:dashed; }
</style>
</head>
<body>
<header>
  <h1>smooth-svg</h1>
  <label class="btn">Open image<input id="file" type="file" accept="image/png,image/jpeg" hidden></label>
  <label class="btn" title="An SVG from another tool, to compare against">Load reference SVG<input id="ref" type="file" accept=".svg,image/svg+xml" hidden></label>
  <button id="refBtn" disabled>Show: mine</button>
  <button id="wipeBtn">Wipe mode</button>
  <button id="themeBtn">Theme</button>
</header>
<main>
  <div id="panel">
    <h2>Image</h2>
    <label>Model
      <select id="model"><option>auto</option><option>clipart</option><option>drawing</option><option>pixelart</option><option>photo</option></select>
      <small id="usedModel"></small></label>
    <label class="row"><input id="bg" type="checkbox"> Remove background</label>
    <label class="row"><input id="denoise" type="checkbox" checked> Clean noise</label>
    <h2>Colors</h2>
    <label>Colors <b id="v_colors">auto</b><input id="colors" type="range" min="0" max="16" value="0"></label>
    <label>Merge similar colors <b id="v_merge">10</b><input id="merge" type="range" min="0" max="40" value="10"></label>
    <div id="palette" title="Click a color to remove its layer"></div>
    <h2>Edges</h2>
    <label>Smooth <b id="v_smooth">2</b><input id="smooth" type="range" min="0" max="5" value="2"></label>
    <label>Corners <b id="v_corner">auto</b><input id="corner" type="range" min="0" max="180" step="5" value="0"></label>
    <label>Curve simplify <b id="v_detail">auto</b><input id="detail" type="range" min="0" max="20" value="0"></label>
    <h2>Small details</h2>
    <label>Min speckle <b id="v_speckle">1</b><input id="speckle" type="range" min="0" max="16" value="1"></label>
    <label>Min area (px) <b id="v_area">auto</b><input id="area" type="range" min="0" max="2000" step="10" value="0"></label>
    <h2>Shapes</h2>
    <label class="row"><input id="ellipses" type="checkbox" checked> Circles &amp; ellipses</label>
    <label class="row"><input id="polygons" type="checkbox"> Straight-edge polygons</label>
    <label>Shape tolerance <b><span id="v_tol">3</span>%</b><input id="tol" type="range" min="1" max="15" value="3"></label>
    <div class="hint">Wheel: zoom. Drag: move. Double click: fit.</div>
  </div>
  <div id="views">
    <div class="pane" id="inPane"><span class="tag">Input</span><div class="layer" id="inLayer"><img id="inImg" alt=""></div></div>
    <div class="pane" id="outPane"><span class="tag">SVG</span><div class="layer" id="svgBox"></div></div>
    <div id="wipeBar"></div>
    <div id="drop">Drop a PNG or JPG here</div>
    <div id="busy" role="status" aria-live="polite"><div class="spinner"></div></div>
  </div>
</main>
<footer>
  <span id="stats">No image</span><span class="sp"></span>
  <input id="wipe" type="range" min="0" max="100" value="50" hidden title="Wipe position">
  <button id="dl" disabled>Download SVG</button><button id="cp" disabled>Copy SVG</button>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
