name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write            # only to create the release
jobs:
  build:
    runs-on: windows-latest
    steps:
      # uses: pinned to commit SHAs (comment = tag they were resolved from)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - name: Tag equals code version
        shell: pwsh
        run: |
          $v = python -c "import smoothsvg; print(smoothsvg.__version__)"
          if ("v$v" -ne "$env:GITHUB_REF_NAME") { throw "tag $env:GITHUB_REF_NAME != __version__ $v" }
      - run: pip install -e ".[app,dev]" pyinstaller
      - run: python -m pytest -q
      - run: python packaging/make_ico.py
      - run: pyinstaller packaging/smooth-svg.spec --noconfirm
      - run: python packaging/smoke.py dist/smooth-svg/smooth-svg.exe
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress; $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          iscc "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" packaging/smooth-svg.iss
      - name: SHA256
        shell: pwsh
        run: |
          cd dist
          Get-FileHash smooth-svg-setup-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/smooth-svg-setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
